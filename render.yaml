services:
  - type: web
    name: nexusflow
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NEXUSFLOW_AUTH_TOKEN
        generateValue: true
      - key: NEXUSFLOW_NO_BROWSER
        value: "1"
      - key: ANTHROPIC_API_KEY
        sync: false
